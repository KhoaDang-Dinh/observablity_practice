name: Day 3 - Terraform, EKS, CI-CD and LGTM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

  push:
    branches: [dev]
    paths:
      - "app/**"
      - "infra/terraform/**"
      - "argocd/**"
      - "deploy/**"
      - ".github/workflows/build.yaml"

concurrency:
  group: day3-dev
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: day3-backend
  TF_DIR: infra/terraform
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: terraform/day3/dev/terraform.tfstate
  TERRAFORM_VERSION: 1.16.2
  ARGOCD_VERSION: v3.5.3
  MONTHLY_COST_LIMIT_USD: ${{ vars.MONTHLY_COST_LIMIT_USD }}
  TF_VAR_enable_aws_finops: ${{ vars.ENABLE_AWS_FINOPS || 'false' }}
  TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD || '400' }}
  TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL || '' }}
  TF_VAR_enable_cur2_export: ${{ vars.ENABLE_CUR2_EXPORT || 'false' }}

jobs:
  destroy:
    name: Destroy Terraform Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'

    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "GitHub variable TF_STATE_BUCKET is missing."
            exit 1
          fi
          echo "Using state: s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}"

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Setup kubectl for cleanup
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest

      - name: Discover lab resources
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_NAME="$(terraform output -raw cluster_name 2>/dev/null || true)"
          VPC_ID="$(terraform output -raw vpc_id 2>/dev/null || true)"
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> "$GITHUB_ENV"
          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "Cluster: ${CLUSTER_NAME:-already deleted}"
          echo "VPC:     ${VPC_ID:-already deleted}"

      - name: Remove Kubernetes managed load balancers
        shell: bash
        run: |
          set +e
          if [ -n "${CLUSTER_NAME:-}" ] && aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

            # Stop Argo CD self-healing before deleting the public Services.
            kubectl delete application day3 -n argocd --ignore-not-found=true --wait=false || true

            # These Services create AWS load balancers outside Terraform.
            kubectl delete service backend -n application --ignore-not-found=true --wait=true || true
            kubectl delete service grafana-public -n observability --ignore-not-found=true --wait=true || true
          else
            echo "EKS cluster is already absent; cleaning any orphaned AWS load balancers directly."
          fi

      - name: Remove orphaned load balancers from lab VPC
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VPC_ID:-}" ]; then
            echo "No VPC ID in Terraform state; skipping direct load balancer cleanup."
            exit 0
          fi

          # The VPC is dedicated to this disposable lab, so remove any remaining
          # ALB/NLB/CLB that would otherwise leave ENIs/public mappings behind.
          for arn in $(aws elbv2 describe-load-balancers             --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn"             --output text 2>/dev/null); do
            [ -n "$arn" ] || continue
            echo "Deleting ELBv2: $arn"
            aws elbv2 delete-load-balancer --load-balancer-arn "$arn"
          done

          for name in $(aws elb describe-load-balancers             --query "LoadBalancerDescriptions[?VPCId=='$VPC_ID'].LoadBalancerName"             --output text 2>/dev/null); do
            [ -n "$name" ] || continue
            echo "Deleting Classic ELB: $name"
            aws elb delete-load-balancer --load-balancer-name "$name"
          done

          # ELB deletion is asynchronous. Wait until the LB control-plane objects
          # and their requester-managed ENIs/public address mappings are gone.
          for i in {1..60}; do
            V2_COUNT=$(aws elbv2 describe-load-balancers               --query "length(LoadBalancers[?VpcId=='$VPC_ID'])"               --output text 2>/dev/null || echo 0)
            CLB_COUNT=$(aws elb describe-load-balancers               --query "length(LoadBalancerDescriptions[?VPCId=='$VPC_ID'])"               --output text 2>/dev/null || echo 0)

            LB_ENIS=$(aws ec2 describe-network-interfaces               --filters "Name=vpc-id,Values=$VPC_ID"               --query "length(NetworkInterfaces[?contains(Description, 'ELB')])"               --output text 2>/dev/null || echo 0)

            echo "Cleanup wait $i/60: elbv2=$V2_COUNT classic=$CLB_COUNT elb_enis=$LB_ENIS"
            if [ "$V2_COUNT" = "0" ] && [ "$CLB_COUNT" = "0" ] && [ "$LB_ENIS" = "0" ]; then
              break
            fi
            sleep 10
          done

          echo "Remaining public mappings before Terraform destroy:"
          aws ec2 describe-network-interfaces             --filters "Name=vpc-id,Values=$VPC_ID"             --query "NetworkInterfaces[?Association.PublicIp!=null].[NetworkInterfaceId,Association.PublicIp,Description,Attachment.InstanceId]"             --output table || true

      - name: Terraform Destroy Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -out=destroy.tfplan

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            destroy.tfplan

  infrastructure:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event.inputs.action == 'apply')
    outputs:
      cluster_name: ${{ steps.tf-output.outputs.cluster_name }}
      db_endpoint: ${{ steps.tf-output.outputs.db_endpoint }}
      db_name: ${{ steps.tf-output.outputs.db_name }}
      db_secret_arn: ${{ steps.tf-output.outputs.db_secret_arn }}
      telemetry_bucket: ${{ steps.tf-output.outputs.telemetry_bucket }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "GitHub variable TF_STATE_BUCKET is missing."
            exit 1
          fi
          echo "Terraform state bucket configured."
          echo "State key: $TF_STATE_KEY"

      - name: Configure Terraform AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-${{ github.run_id }}

      - name: Show Terraform AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Export Terraform Plan JSON
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -json tfplan > tfplan.json

      - name: Install C3X
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.3.4"
          ARCHIVE="c3x_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/c3xdev/c3x/releases/download/v${VERSION}/${ARCHIVE}"

          curl -fL "${URL}" -o /tmp/c3x.tar.gz
          tar -xzf /tmp/c3x.tar.gz -C /tmp
          install -m 0755 /tmp/c3x /usr/local/bin/c3x
          c3x --version

      - name: Estimate monthly infrastructure cost with C3X
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          C3X_ARGS=(
            estimate
            --path tfplan.json
            --format json
          )

          if [ -n "${MONTHLY_COST_LIMIT_USD:-}" ]; then
            C3X_ARGS+=(--budget "$MONTHLY_COST_LIMIT_USD")
          fi

          # Run once for a human-readable table in the job log.
          c3x estimate --path tfplan.json

          # Run machine-readable output and enforce the optional monthly budget.
          c3x "${C3X_ARGS[@]}" > c3x.json

          TOTAL_MONTHLY_COST="$(jq -r '.project_total // 0' c3x.json)"

          {
            echo "## C3X pre-deploy cost estimate"
            echo
            echo "- Estimated Terraform-managed monthly cost: **\$${TOTAL_MONTHLY_COST}**"
            if [ -n "${MONTHLY_COST_LIMIT_USD:-}" ]; then
              echo "- CI monthly limit: **\$${MONTHLY_COST_LIMIT_USD}**"
            fi
            echo "- C3X is open source and does not require an API key."
            echo "- Kubernetes-created AWS resources may not be fully represented; AWS Cost Explorer/CUR remains the source of truth for actual spend."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan

      - name: Export Terraform Outputs
        id: tf-output
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          DB_ENDPOINT="$(terraform output -raw db_endpoint)"
          DB_NAME="$(terraform output -raw db_name)"
          DB_SECRET_ARN="$(terraform output -raw db_master_secret_arn)"
          TELEMETRY_BUCKET="$(terraform output -raw telemetry_bucket_name)"
          test -n "$CLUSTER_NAME"
          test -n "$DB_ENDPOINT"
          test -n "$DB_NAME"
          test -n "$DB_SECRET_ARN"
          test -n "$TELEMETRY_BUCKET"
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "db_endpoint=$DB_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "db_secret_arn=$DB_SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo "telemetry_bucket=$TELEMETRY_BUCKET" >> "$GITHUB_OUTPUT"
          echo "EKS cluster: $CLUSTER_NAME"
          echo "RDS endpoint: $DB_ENDPOINT"

  build:
    name: Build and Publish Backend
    runs-on: ubuntu-latest
    needs: [infrastructure]
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure ECR AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ecr-${{ github.run_id }}

      - name: Show ECR AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker build --pull -t "$IMAGE" ./app
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Backend Image
        run: docker push "$IMAGE"

      - name: Update GitOps Manifest
        run: |
          set -euo pipefail
          sed -i -E "s#image: .*/day3-backend:[^ ]+#image: ${IMAGE}#" deploy/dev/backend.yaml
          sed -i -E "s#value: (bootstrap|[0-9a-f]{40})#value: ${GITHUB_SHA}#" deploy/dev/backend.yaml
          grep "image:" deploy/dev/backend.yaml

      - name: Commit Desired State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/dev/backend.yaml
          if git diff --cached --quiet; then
            echo "Desired state already current."
            exit 0
          fi
          git commit -m "deploy backend ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:dev

  kubernetes-bootstrap:
    name: Bootstrap Kubernetes
    runs-on: ubuntu-latest
    needs: [infrastructure, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Configure EKS AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eks-${{ github.run_id }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ needs.infrastructure.outputs.cluster_name }}"

      - name: Verify Kubernetes API
        run: kubectl cluster-info

      - name: Wait for EKS Worker Nodes
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            NODE_COUNT="$(kubectl get nodes --no-headers 2>/dev/null | wc -l)"
            if [ "$NODE_COUNT" -gt 0 ]; then
              kubectl wait --for=condition=Ready node --all --timeout=10m
              exit 0
            fi
            echo "No worker node yet. Attempt $i/60"
            sleep 10
          done
          echo "No worker nodes joined EKS."
          exit 1

      - name: Show Nodes
        run: kubectl get nodes -o wide

      - name: Show EKS System Pods
        run: kubectl get pods -n kube-system -o wide

      - name: Create Namespaces
        run: |
          kubectl create namespace application --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure telemetry storage
        env:
          TELEMETRY_BUCKET: ${{ needs.infrastructure.outputs.telemetry_bucket }}
        run: |
          set -euo pipefail
          test -n "$TELEMETRY_BUCKET"
          kubectl create configmap telemetry-storage \
            --namespace observability \
            --from-literal=bucket="$TELEMETRY_BUCKET" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "LGTM snapshots will sync to s3://$TELEMETRY_BUCKET/telemetry/lgtm/"

      - name: Sync Grafana admin secret from AWS Secrets Manager
        shell: bash
        env:
          GRAFANA_SECRET_ID: ${{ needs.infrastructure.outputs.cluster_name }}/grafana-admin
        run: |
          set -euo pipefail

          if aws secretsmanager describe-secret             --secret-id "$GRAFANA_SECRET_ID"             --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "Using existing Grafana credential from AWS Secrets Manager."
            SECRET_JSON="$(aws secretsmanager get-secret-value               --secret-id "$GRAFANA_SECRET_ID"               --region "$AWS_REGION"               --query SecretString               --output text)"
          else
            echo "Creating persistent Grafana credential in AWS Secrets Manager."
            PASSWORD="$(openssl rand -base64 32 | tr -d '\n')"
            echo "::add-mask::$PASSWORD"

            SECRET_JSON="$(jq -nc               --arg username "admin"               --arg password "$PASSWORD"               '{username: $username, password: $password}')"

            aws secretsmanager create-secret               --name "$GRAFANA_SECRET_ID"               --description "Persistent Grafana admin credential for the day3 EKS observability lab"               --secret-string "$SECRET_JSON"               --tags                 Key=Project,Value=day3-cicd-lgtm                 Key=Environment,Value=dev                 Key=Component,Value=grafana               --region "$AWS_REGION" >/dev/null
          fi

          GRAFANA_USER="$(jq -r '.username' <<< "$SECRET_JSON")"
          GRAFANA_PASSWORD="$(jq -r '.password' <<< "$SECRET_JSON")"

          test -n "$GRAFANA_USER"
          test "$GRAFANA_USER" != "null"
          test -n "$GRAFANA_PASSWORD"
          test "$GRAFANA_PASSWORD" != "null"

          echo "::add-mask::$GRAFANA_USER"
          echo "::add-mask::$GRAFANA_PASSWORD"

          kubectl create secret generic grafana-admin             --namespace observability             --from-literal=admin-user="$GRAFANA_USER"             --from-literal=admin-password="$GRAFANA_PASSWORD"             --dry-run=client -o yaml | kubectl apply -f -

          echo "Grafana Kubernetes secret synchronized from $GRAFANA_SECRET_ID."

          # Secret-backed environment variables are read only when the pod starts.
          # If Grafana already exists (for example on an in-place CI update),
          # recreate the pod so it receives the synchronized credential.
          if kubectl get deployment grafana -n observability >/dev/null 2>&1; then
            kubectl rollout restart deployment/grafana -n observability
            kubectl rollout status deployment/grafana -n observability --timeout=5m
          fi

      - name: Sync RDS Secret to Kubernetes
        shell: bash
        env:
          DB_ENDPOINT: ${{ needs.infrastructure.outputs.db_endpoint }}
          DB_NAME: ${{ needs.infrastructure.outputs.db_name }}
          DB_SECRET_ARN: ${{ needs.infrastructure.outputs.db_secret_arn }}
        run: |
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$DB_SECRET_ARN" \
            --query SecretString \
            --output text)"
          DB_USER="$(jq -r '.username' <<< "$SECRET_JSON")"
          DB_PASSWORD="$(jq -r '.password' <<< "$SECRET_JSON")"
          test -n "$DB_USER"
          test -n "$DB_PASSWORD"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"

          kubectl create secret generic rds-postgres \
            --namespace application \
            --from-literal=host="$DB_ENDPOINT" \
            --from-literal=port="5432" \
            --from-literal=database="$DB_NAME" \
            --from-literal=username="$DB_USER" \
            --from-literal=password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "RDS Kubernetes secret synchronized."

      - name: Check Argo CD
        id: argocd-check
        shell: bash
        run: |
          if kubectl get deployment argocd-server -n argocd >/dev/null 2>&1; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Argo CD
        if: steps.argocd-check.outputs.installed == 'false'
        run: |
          kubectl apply \
            --server-side \
            --force-conflicts \
            -n argocd \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"

      - name: Wait for Argo CD Server
        run: |
          kubectl rollout status deployment/argocd-server -n argocd --timeout=10m

      - name: Create or Update Argo CD Application
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: day3
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/${REPOSITORY}.git
              targetRevision: dev
              path: deploy/dev
            destination:
              server: https://kubernetes.default.svc
              namespace: application
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF

      - name: Show Argo CD
        run: |
          kubectl get pods -n argocd
          kubectl get application day3 -n argocd -o wide

  verify:
    name: Verify Deployment and Observability
    runs-on: ubuntu-latest
    needs: [infrastructure, kubernetes-bootstrap]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: verify-${{ github.run_id }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ needs.infrastructure.outputs.cluster_name }}"

      - name: Wait for Argo CD to Create Backend
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if kubectl get deployment backend -n application >/dev/null 2>&1; then
              echo "Backend Deployment exists."
              exit 0
            fi
            echo "Waiting for Argo CD sync... $i/60"
            sleep 10
          done
          echo "Backend Deployment was not created."
          exit 1

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n application --timeout=10m

      - name: Show Application
        run: |
          kubectl get pods -n application -o wide
          kubectl get svc -n application

      - name: Show Observability Stack
        run: |
          kubectl get pods -n observability -o wide || true
          kubectl get svc -n observability || true

      - name: Print Public Endpoints
        shell: bash
        run: |
          set -u
          APP_HOST=""
          GRAFANA_HOST=""

          for i in {1..60}; do
            APP_HOST="$(kubectl get svc backend -n application -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -z "$APP_HOST" ]; then
              APP_HOST="$(kubectl get svc backend -n application -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            fi

            GRAFANA_HOST="$(kubectl get svc grafana-public -n observability -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -z "$GRAFANA_HOST" ]; then
              GRAFANA_HOST="$(kubectl get svc grafana-public -n observability -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            fi

            if [ -n "$APP_HOST" ] && [ -n "$GRAFANA_HOST" ]; then
              break
            fi

            echo "Waiting for AWS load balancer endpoints... $i/60"
            sleep 10
          done

          echo "========================================"
          echo "PUBLIC ENDPOINTS"
          echo "========================================"

          if [ -n "$APP_HOST" ]; then
            echo "App:     http://${APP_HOST}"
          else
            echo "App:     endpoint still pending"
          fi

          if [ -n "$GRAFANA_HOST" ]; then
            echo "Grafana: http://${GRAFANA_HOST}"
          else
            echo "Grafana: endpoint still pending"
          fi

          echo "RDS:     ${{ needs.infrastructure.outputs.db_endpoint }}:5432 (private)"

          {
            echo "## EKS public endpoints"
            echo
            if [ -n "$APP_HOST" ]; then
              echo "- App: http://${APP_HOST}"
              echo "- DB check: http://${APP_HOST}/db"
            else
              echo "- App: endpoint still pending"
            fi
            if [ -n "$GRAFANA_HOST" ]; then
              echo "- Grafana: http://${GRAFANA_HOST}"
            else
              echo "- Grafana: endpoint still pending"
            fi
            echo "- RDS: ${{ needs.infrastructure.outputs.db_endpoint }}:5432 (private VPC endpoint)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resource Usage
        run: |
          echo "=== APPLICATION ==="
          kubectl top pods -n application || true
          echo "=== OBSERVABILITY ==="
          kubectl top pods -n observability || true
          echo "=== NODES ==="
          kubectl top nodes || true

      - name: Show Argo CD Application Status
        run: |
          kubectl get application day3 -n argocd -o wide
          kubectl get application day3 -n argocd \
            -o jsonpath='Sync: {.status.sync.status}{"\n"}Health: {.status.health.status}{"\n"}' \
            || true
