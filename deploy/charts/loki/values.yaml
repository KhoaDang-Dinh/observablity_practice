replicaCount: 1

image:
  repository: grafana/loki
  tag: "3.7.8"

serviceAccount:
  name: loki

service:
  port: 3100

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

podLabels:
  cost-component: loki
  cost-project: day3-cicd-lgtm
  environment: dev

config: |
  auth_enabled: false

  server:
    http_listen_port: 3100

  common:
    path_prefix: /var/loki
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory

  schema_config:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage_config:
    use_thanos_objstore: true
    object_store:
      storage_prefix: telemetry-loki
      s3:
        bucket_name: ${S3_BUCKET}
        endpoint: s3.ap-southeast-1.amazonaws.com
        region: ap-southeast-1
        native_aws_auth_enabled: true

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: s3

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
