apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-otel-sidecar
  namespace: application
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        filter:
          namespace: application
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2048
        retry_on_failure:
          enabled: true

      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        sending_queue:
          enabled: true
          queue_size: 2048
        retry_on_failure:
          enabled: true

      prometheusremotewrite/mimir:
        endpoint: http://mimir.observability.svc.cluster.local:9009/api/v1/push
        resource_to_telemetry_conversion:
          enabled: true
        remote_write_queue:
          enabled: true
          queue_size: 2048

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheusremotewrite/mimir]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        cost-component: backend
        cost-project: day3-cicd-lgtm
        environment: dev
    spec:
      serviceAccountName: backend-otel
      containers:
        - name: backend
          # GitHub Actions updates this line after pushing to ECR.
          image: 590183737254.dkr.ecr.ap-southeast-1.amazonaws.com/day3-backend:04958ee021c68e91b767e9f692d783b4497587c7
          env:
            - name: OTEL_SERVICE_NAME
              value: backend
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: 127.0.0.1:4317
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: SERVICE_VERSION
              value: 04958ee021c68e91b767e9f692d783b4497587c7
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: password
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

        - name: otel-sidecar
          image: otel/opentelemetry-collector-contrib:0.161.0
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - --config=/etc/otelcol-contrib/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: otel-sidecar-config
              mountPath: /etc/otelcol-contrib

      volumes:
        - name: otel-sidecar-config
          configMap:
            name: backend-otel-sidecar
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: application
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=day3-cicd-lgtm,Environment=dev,Component=app-load-balancer"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
