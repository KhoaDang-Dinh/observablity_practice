apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # GitHub Actions updates this line after pushing to ECR.
          image: 590183737254.dkr.ecr.ap-southeast-1.amazonaws.com/day3-backend:62484c6c95da06b731abaa57178bcae01ceb763e
          env:
            - name: OTEL_SERVICE_NAME
              value: backend
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: lgtm.observability.svc.cluster.local:4317
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://lgtm.observability.svc.cluster.local:4040
            - name: SERVICE_VERSION
              value: 62484c6c95da06b731abaa57178bcae01ceb763e
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-postgres
                  key: password
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: application
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
