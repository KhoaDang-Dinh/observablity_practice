# Optional and COSTING MONEY: public browser access for the lab.
apiVersion: v1
kind: Service
metadata:
  name: grafana-public
  namespace: observability
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=day3-cicd-lgtm,Environment=dev,Component=grafana-load-balancer"
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
