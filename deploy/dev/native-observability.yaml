apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: s3
        s3:
          bucket: ${S3_BUCKET}
          prefix: telemetry/tempo
          endpoint: s3.ap-southeast-1.amazonaws.com
          region: ap-southeast-1
        wal:
          path: /var/tempo/wal

    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
        cost-component: tempo
        cost-project: day3-cicd-lgtm
        environment: dev
    spec:
      serviceAccountName: tempo
      containers:
        - name: tempo
          image: grafana/tempo:3.0.3
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: telemetry-storage
                  key: bucket
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: false

    server:
      http_listen_port: 9009

    common:
      storage:
        backend: s3
        s3:
          bucket_name: ${S3_BUCKET}
          endpoint: s3.ap-southeast-1.amazonaws.com
          region: ap-southeast-1
          native_aws_auth_enabled: true

    blocks_storage:
      storage_prefix: telemetrymimirblocks
      tsdb:
        dir: /var/mimir/tsdb
      bucket_store:
        sync_dir: /var/mimir/tsdb-sync

    ruler_storage:
      storage_prefix: telemetrymimirruler

    alertmanager_storage:
      storage_prefix: telemetrymimiralertmanager

    ingester:
      ring:
        replication_factor: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
        cost-component: mimir
        cost-project: day3-cicd-lgtm
        environment: dev
    spec:
      serviceAccountName: mimir
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
            - -target=all
          env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: telemetry-storage
                  key: bucket
          ports:
            - name: http
              containerPort: 9009
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 700m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /var/mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
---
